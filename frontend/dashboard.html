<!DOCTYPE html>
<html>
    <head>
        <title>Spotify Tools</title>
        <script src="playlist_retreive.js" type="module"></script>
        <script src="auth.js" type="module"></script>
        <script src="config.js" type="module"></script>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="logo.png">
    </head>
    <body>
        <template id="track-template">
            <tr class="table-data-row">
                <td><h3 class="track-index">1</h3></td>
                <td><h3 class="track-name">Track Name</h3></td>
                <td><h4 class="artist-name">Artist Name</h4></td>
                <td><h4 class="album-name">Album Name</h4></td>
                <td><p class="is-a-play">A-Play</p></td>
            </tr>
        </template>

        <template id="playlist-template">
            <tr class="table-data-row">
                <td><h4 class="playlist-index">1</h4></td>
                <td><h4 class="playlist-name">Playlist Name</h4></td>
                <td><span class="playlist-id-title">Playlist ID: </span><span class="playlist-id">Playlist ID</span></td>
                <td><p class="is-a-play">A-Play</p></td>
                <td><button class="button-transparent-style open-playlist-button">Open Playlist</button></td>
            </tr>
        </template>

        <template id="playlists-table-header-template">
                <tr>
                    <th>#</th>
                    <th>Playlist Name</th>
                    <th>Playlist ID</th>
                    <th>Is A-Play</th>
                    <th></th>
                </tr>
        </template>

        <template id="playlist-table-header-template">
                <tr>
                    <th>#</th>
                    <th>Track Name</th>
                    <th>Artists</th>
                    <th>Album</th>
                    <th>Is A-Play</th>
                </tr>
        </template>

        <template id="return-to-playlists-button-template">
            <button id="return-to-playlists-button" class="button-black-style">Return to Playlists</button>
        </template>

        <template id="check-for-a-play-button-template">
            <button id="check-for-a-play-button" class="button-green-style">Check for A-Play</button>
        </template>

        <template id="refine-playlist-button-template">
            <button id="refine-playlist-button" class="button-green-style">Refine Playlist</button>
        </template>


        <div id="container">
            <div id="controls">
                <h1 id="container-name">Playlists</h1>
                <button id="check-for-a-play-button" class="button-green-style">Check for A-Play</button>

                <button id="logout-button" class="button-black-style">Log Out</button>
            </div>

            <table>
                <thead id="data-table-header">
                </thead>
                <tbody id="data-table-body">
                </tbody>
            </table>
        </div>
    </body>
</html>
